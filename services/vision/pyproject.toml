[project]
name = "touchline-vision"
version = "0.2.0"
description = "Local causal football vision, grounded narration and offline audio"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.143.3", "uvicorn[standard]==0.54.0",
  "python-multipart==0.0.32", "opencv-python-headless==5.0.0.93",
  "onnxruntime==1.31.0", "numpy==2.4.6", "huggingface-hub==2.2.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]
neural = ["piper-tts==1.8.0"]

[project.scripts]
touchline-vision = "touchline_vision.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["touchline_vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
